services:
  tennis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silaeder-tennis
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    environment:
      TENNIS_DB_PATH: /data/tennis.db
      PORT: "${PORT:-5000}"
      TZ: Europe/Moscow
    volumes:
      - tennis-data-v2:/data
      - tennis-data:/legacy-data:ro
      - type: bind
        source: ./tennis.db
        target: /seed/tennis.db
        read_only: true
    command:
      - sh
      - -c
      - |
        if [ ! -f "$${TENNIS_DB_PATH}" ]; then
          if [ -f /legacy-data/tennis.db ]; then
            cp /legacy-data/tennis.db "$${TENNIS_DB_PATH}"
          else
            cp /seed/tennis.db "$${TENNIS_DB_PATH}"
          fi
        fi
        exec waitress-serve --listen=0.0.0.0:$${PORT} app:app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"PORT\"]}/api/state', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tennis-data:
  tennis-data-v2:
